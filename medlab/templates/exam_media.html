{% from 'icons.html' import icon %}
{% macro media_card(media, show_exam=false) -%}
<figure class="exam-media-card">
  <div class="exam-media-heading"><span>{{ icon('image',15) }} IMAGEM DO EXAME</span><a href="{{ media.url }}" target="_blank" rel="noopener noreferrer" aria-label="Abrir imagem de {{ media.exam_name }} em nova aba">Ampliar {{ icon('arrow-up',13) }}</a></div>
  <a class="exam-media-image" href="{{ media.url }}" target="_blank" rel="noopener noreferrer" aria-label="Ampliar imagem de {{ media.exam_name }}"><img src="{{ media.url }}" alt="{{ media.caption }}" loading="lazy" decoding="async"{% if media.width and media.height %} width="{{ media.width }}" height="{{ media.height }}"{% endif %}></a>
  <figcaption>{% if show_exam %}<div class="exam-media-exam"><strong>{{ media.exam_name }}</strong><span>{{ 'Solicitado na consulta' if media.requested else 'Disponível nesta revisão' }}</span></div>{% endif %}<p>{{ media.caption }}</p><div class="exam-media-credit">{% if media.credit %}<span>{{ media.credit }}</span>{% endif %}{% if media.license_url %}<a href="{{ media.license_url }}" target="_blank" rel="noopener noreferrer">{{ media.license_code }}</a>{% endif %}<span>Imagem original; legenda em português.</span>{% if media.review_mode == 'machine' %}<span>Seleção e conferência por IA.</span>{% endif %}</div>{% if media.source_url %}<details class="exam-media-source"><summary>Origem e créditos da imagem</summary><p><a href="{{ media.source_url }}" target="_blank" rel="noopener noreferrer">{{ media.source_title }} {{ icon('arrow-up',12) }}</a></p>{% if media.attribution %}<p>{{ media.attribution }}</p>{% endif %}{% if media.attribution_notice %}<p>{{ media.attribution_notice }}</p>{% endif %}{% if media.license_text %}<p>{{ media.license_text }}</p>{% endif %}</details>{% endif %}</figcaption>
</figure>
{%- endmacro %}
