<article class="case-card"><div class="case-card-top"><span class="case-specialty">{{ case.specialty }}</span><span class="case-symbol">{{ icon('pulse',23) }}</span></div><h3>{{ case.title }}</h3><p class="case-summary">{{ case.summary or case.complaint }}</p>{% if case.case_type %}<div class="case-patient case-type-label">{{ icon('case',16) }}<span>{{ case.case_type }}</span></div>{% endif %}<div class="case-meta"><span class="difficulty-dot difficulty-{{ case.difficulty|lower }}">{{ case.difficulty }}</span><span>{{ icon('clock',14) }} {{ case.estimated_minutes }} min</span></div><form method="post" action="/casos/iniciar"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="case_id" value="{{ case.id }}"><button type="submit" class="case-start">Iniciar consulta {{ icon('arrow',18) }}</button></form></article>
